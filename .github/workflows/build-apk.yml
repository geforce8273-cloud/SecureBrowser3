
name: Build SecureBrowser APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - "**/*.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract project ZIP
        run: |
          ZIP=$(find . -type f -iname "*.zip" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ZIP not found"
            exit 1
          fi
          mkdir -p extracted
          unzip -o "$ZIP" -d extracted

      - name: Locate Android project
        run: |
          WRAPPER=$(find extracted -name gradle-wrapper.properties | head -n 1)
          if [ -z "$WRAPPER" ]; then
            echo "gradle-wrapper.properties not found"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$(dirname "$WRAPPER")")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "WRAPPER=$WRAPPER" >> "$GITHUB_ENV"

      - name: Install Gradle directly
        run: |
          URL=$(grep distributionUrl "$WRAPPER" | sed 's/.*=//;s/\\:/:/g')
          FILE=$(basename "$URL")
          VERSION=${FILE%-bin.zip}
          VERSION=${VERSION%-all.zip}

          echo "Gradle version: $VERSION"

          wget "$URL" -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp

          echo "/tmp/$VERSION/bin" >> "$GITHUB_PATH"

      - name: Configure Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH

          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SecureBrowser-APK
          path: "**/build/outputs/apk/debug/*.apk"


name: Build SecureBrowser APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - "**/*.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract project ZIP
        run: |
          ZIP=$(find . -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ZIP file not found"
            exit 1
          fi

          mkdir extracted
          unzip -o "$ZIP" -d extracted

      - name: Locate Android project
        run: |
          GRADLE=$(find extracted -name gradlew | head -n 1)

          if [ -z "$GRADLE" ]; then
            echo "gradlew not found"
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$GRADLE")" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SecureBrowser-APK
          path: "**/build/outputs/apk/debug/*.apk"
